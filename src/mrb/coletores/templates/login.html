<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 1rem;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px;
            font-size: 1.1em;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 12px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #2d89ef;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <h2>Acesso ao Sistema</h2>

    {% if erro %}
    <div id="mensagem-erro" style="color: red; text-align: center; margin-bottom: 1rem;">
        {{ erro }}
    </div>
    {% endif %}

    {% if ja_autenticado %}
    <p style="text-align: center;">Você já está autenticado.</p>
    <div style="text-align: center;">
        <a href="/ordens">
            <button type="button"
                style="padding: 12px; font-size: 1em; background-color: #2d89ef; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Retornar
            </button>
        </a>
        <form method="post" action="/logout" style="display: inline;">
            <button type="submit"
                style="padding: 12px; font-size: 1em; background-color: #d9534f; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">
                Logout
            </button>
        </form>
    </div>
    {% else %}
    <form method="post" action="/login" autocomplete="off">
        <input type="text" name="usuario" placeholder="Usuário" required />
        <div style="position: relative; display: inline-block; width: 100%;">
            <input type="password" id="campo_senha" name="senha" placeholder="Senha" required />
            <i id="icone_visibilidade" class="fa-solid fa-eye-slash" onclick="alternarSenha()" style="
                    position: absolute; 
                    top: 0; 
                    bottom: 0; 
                    right: 10px; 
                    display: flex; 
                    align-items: center; 
                    cursor: pointer; 
                    color: black;
                    "></i>
        </div>
        <button type="submit">Entrar</button>
    </form>
    {% endif %}

    <script>
        const campoUsuario = document.querySelector('input[name="usuario"]');
        const campoSenha = document.querySelector('input[name="senha"]');
        const botao = document.querySelector('button[type="submit"]');

        function limparErro() {
            const mensagemErro = document.getElementById("mensagem-erro");
            if (mensagemErro) {
                mensagemErro.remove();
            }
        }

        campoUsuario.addEventListener("input", limparErro);
        campoSenha.addEventListener("input", limparErro);
    </script>
    <script>
        function alternarSenha() {
            const campo = document.getElementById("campo_senha");
            const icone = document.getElementById("icone_visibilidade");

            if (campo.type === "password") {
                campo.type = "text";
                icone.classList.replace("fa-eye-slash", "fa-eye");
            } else {
                campo.type = "password";
                icone.classList.replace("fa-eye", "fa-eye-slash");
            }
        }
    </script>

</body>

</html>
