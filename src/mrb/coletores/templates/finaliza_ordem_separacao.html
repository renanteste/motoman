<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalização da Ordem {{ ordem_separacao }}</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 1rem;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 600px;
            margin: 3rem auto;
            text-align: center;
        }

        h2 {
            margin-bottom: 1rem;
            color: #333;
        }

        p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 2rem;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .btn-voltar {
            background: #6c757d;
            color: white;
        }

        .btn-voltar:hover {
            background: #5a6268;
        }

        .btn-encerrar {
            background: #28a745;
            color: white;
        }

        .btn-encerrar:hover {
            background: #218838;
        }

        .mensagem {
            font-weight: bold;
            color: #222;
            margin-top: 0.5rem;
        }

        .os-numero {
            background: #007bff;
            color: white;
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="os-numero">Ordem de Separação {{ ordem_separacao }}</div>
        <h2>Finalização da Separação</h2>

        <p class="mensagem">{{ mensagem }}</p>

        <div class="botoes">
            <a href="/ordens" class="btn btn-voltar">← Voltar</a>

            {% if mostrar_botao_encerrar %}
                <button class="btn btn-encerrar" onclick="encerrarSeparacao('{{ ordem_separacao }}')">
                    ✅ Encerrar Separação
                </button>
            {% endif %}

            {% if mostrar_botao_imprimir %}
                <a href="/impressao_etiquetas/{{ ordem_separacao }}" class="btn btn-encerrar">
                    🖨️ Imprimir Etiquetas
                </a>
            {% endif %}
        </div>

    </div>

    <script>
        function encerrarSeparacao(ordem) {
            //if (confirm("Deseja realmente encerrar a separação da ordem " + ordem + "?")) {
                window.location.href = "/encerrar_separacao/" + encodeURIComponent(ordem);
            //}
        }
    </script>
</body>
</html>
