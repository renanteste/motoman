<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificação do Usuário</title>
    <script>
        async function enviarMatricula() {
            const matricula = document.getElementById('matricula').value;
            const response = await fetch(`/authrhhe/${matricula}`);
            const data = await response.json();

            if (response.ok) {
                document.getElementById('form').style.display = 'none';
                document.getElementById('resultado').innerText = "Verifique sua caixa de entrada.";
            } else {
                alert(data.mensagem || data.detail || "Erro desconhecido. Tente novamente.");
            }
        }
    </script>
</head>

<body>
    <h1>Identificação do Usuário</h1>
    <div id="form">
        <label for="matricula">Matrícula (4 dígitos):</label>
        <input type="text" id="matricula" maxlength="4" required>
        <button onclick="enviarMatricula()">Enviar</button>
    </div>
    <div id="resultado"></div>
</body>

</html>
